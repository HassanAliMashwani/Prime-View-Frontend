    <title>Commercial Area - Image Map</title>
    <style>
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .map-container {
        position: relative;
        width: min(100%, 681px);
      }
      .plot-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }
      .plot-overlay polygon {
        fill: transparent;
        stroke: transparent;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
        transition:
          fill 140ms ease,
          stroke 140ms ease,
          filter 140ms ease;
      }
      .plot-overlay polygon.is-hovered {
        fill: rgba(255, 214, 64, 0.42);
        stroke: #fff3a3;
        filter: url(#plot-glow);
      }
      .plot-label {
        display: none;
        fill: #ffffff;
        font:
          700 13px Arial,
          sans-serif;
        paint-order: stroke;
        stroke: #17202a;
        stroke-width: 4px;
        stroke-linejoin: round;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .plot-label.is-visible {
        display: block;
      }
      area {
        cursor: pointer;
      }
    </style>
  </head>

    <script>
      const plotShapes = document.querySelector(".plot-shapes");
      const plotLabels = document.querySelector(".plot-labels");
      const areas = document.querySelectorAll("map area[shape='poly']");

      areas.forEach((area) => {
        const points = area.coords
          .split(",")
          .reduce((coordinates, value, index, values) => {
            if (index % 2 === 0)
              coordinates.push(`${value},${values[index + 1]}`);
            return coordinates;
          }, [])
          .join(" ");
        const number = area.alt.match(/Commercial_(\d+)_/)[1];
        const numericPoints = area.coords.split(",").map(Number);
        const center = numericPoints.reduce(
          (result, value, index) => {
            if (index % 2 === 0) result.x += value;
            else result.y += value;
            return result;
          },
          { x: 0, y: 0 },
        );
        const pointCount = numericPoints.length / 2;

        const polygon = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon",
        );
        polygon.setAttribute("points", points);
        plotShapes.appendChild(polygon);

        const label = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text",
        );
        label.setAttribute("x", center.x / pointCount);
        label.setAttribute("y", center.y / pointCount);
        label.textContent = number;
        label.classList.add("plot-label");
        plotLabels.appendChild(label);

        const setHoverState = (isHovered) => {
          polygon.classList.toggle("is-hovered", isHovered);
          label.classList.toggle("is-visible", isHovered);
        };

        area.addEventListener("mouseenter", () => setHoverState(true));
        area.addEventListener("mouseleave", () => setHoverState(false));
        area.addEventListener("focus", () => setHoverState(true));
        area.addEventListener("blur", () => setHoverState(false));
      });
    </script>
