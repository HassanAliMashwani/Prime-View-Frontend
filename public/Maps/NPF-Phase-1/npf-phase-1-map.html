    <style>
      .prime-view-map-wrapper {
        position: relative;
        display: inline-block;
        line-height: 0;
      }

      .prime-view-map-wrapper > img {
        display: block;
      }

      .prime-view-map-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .prime-view-map-overlay polygon {
        fill: transparent;
        stroke: rgba(255, 255, 255, 0.8);
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
        transition:
          fill 160ms ease,
          stroke 160ms ease,
          filter 160ms ease;
      }

      .prime-view-map-overlay polygon.is-hovered {
        fill: rgba(255, 214, 64, 0.34);
        stroke: #fff3a6;
        stroke-width: 3;
        filter: drop-shadow(0 0 6px rgba(255, 214, 64, 0.95));
      }
    </style>

    <script>
      (() => {
        const map = document.querySelector("#PrimeViewMap");
        const image = document.querySelector('img[usemap="#PrimeViewMap"]');

        if (!map || !image) {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "prime-view-map-wrapper";
        image.parentNode.insertBefore(wrapper, image);
        wrapper.appendChild(image);

        const overlay = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        overlay.classList.add("prime-view-map-overlay");
        overlay.setAttribute(
          "viewBox",
          `0 0 ${image.naturalWidth || image.width} ${image.naturalHeight || image.height}`,
        );
        overlay.setAttribute("preserveAspectRatio", "none");
        wrapper.appendChild(overlay);

        map.querySelectorAll("area[coords]").forEach((area) => {
          const points = area.coords.split(",").map(Number);
          const polygon = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon",
          );
          polygon.setAttribute(
            "points",
            points
              .reduce((output, value, index) => {
                if (index % 2 === 0) {
                  output.push(`${value},${points[index + 1]}`);
                }
                return output;
              }, [])
              .join(" "),
          );
          overlay.appendChild(polygon);

          area.addEventListener("mouseenter", () =>
            polygon.classList.add("is-hovered"),
          );
          area.addEventListener("mouseleave", () =>
            polygon.classList.remove("is-hovered"),
          );
        });
      })();
    </script>
