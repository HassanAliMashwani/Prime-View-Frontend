    .plot-map-wrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
    .plot-map-overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .plot-map-overlay polygon { fill: transparent; stroke: transparent; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: auto; cursor: pointer; transition: fill 120ms ease, stroke 120ms ease, filter 120ms ease; }
    .plot-map-overlay polygon:hover, .plot-map-overlay polygon:focus { fill: rgba(34, 211, 238, .36); stroke: #67e8f9; stroke-width: 3; filter: drop-shadow(0 0 7px #22d3ee); outline: none; }
    .plot-map-tooltip { position: fixed; z-index: 9999; display: none; padding: 7px 11px; border: 1px solid rgba(103,232,249,.8); border-radius: 7px; color: #ecfeff; background: rgba(8,20,35,.94); box-shadow: 0 0 18px rgba(34,211,238,.48); font: 600 14px/1.2 system-ui,sans-serif; pointer-events: none; white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .plot-map-overlay polygon { transition: none; } }
  </style>
  <script>
    (() => {
      const image = document.querySelector('img[usemap="#image-map"]');
      const map = document.querySelector('map[name="image-map"]');
      if (!image || !map) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'plot-map-wrap';
      image.parentNode.insertBefore(wrapper, image);
      wrapper.appendChild(image);
      image.classList.add('plot-map-image');

      const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      overlay.classList.add('plot-map-overlay');
      wrapper.appendChild(overlay);

      const tooltip = document.createElement('div');
      tooltip.className = 'plot-map-tooltip';
      tooltip.setAttribute('role', 'status');
      document.body.appendChild(tooltip);

      function renderAreas() {
        const width = image.naturalWidth;
        const height = image.naturalHeight;
        if (!width || !height) return;
        overlay.setAttribute('viewBox', `0 0 ${width} ${height}`);
        overlay.replaceChildren();

        map.querySelectorAll('area[shape="poly"]').forEach((area) => {
          const coords = (area.coords || '').split(',').map(Number);
          if (coords.length < 6 || coords.length % 2 || coords.some((n) => !Number.isFinite(n))) return;
          const plotNumber = (area.title || area.alt || '').split('_')[2] || '';
          const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const points = [];
          for (let i = 0; i < coords.length; i += 2) points.push(`${coords[i]},${coords[i + 1]}`);
          polygon.setAttribute('points', points.join(' '));
          polygon.setAttribute('tabindex', '0');
          polygon.setAttribute('aria-label', plotNumber ? `Plot ${plotNumber}` : 'Mapped area');

          const showPlot = (event) => {
            if (!plotNumber) return;
            tooltip.textContent = `Plot ${plotNumber}`;
            tooltip.style.display = 'block';
            if (event && Number.isFinite(event.clientX)) {
              tooltip.style.left = `${event.clientX + 14}px`;
              tooltip.style.top = `${event.clientY + 14}px`;
            } else {
              const rect = polygon.getBoundingClientRect();
              tooltip.style.left = `${rect.left + rect.width / 2}px`;
              tooltip.style.top = `${rect.top + rect.height / 2}px`;
            }
          };
          polygon.addEventListener('pointerenter', showPlot);
          polygon.addEventListener('pointermove', showPlot);
          polygon.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });
          polygon.addEventListener('focus', showPlot);
          polygon.addEventListener('blur', () => { tooltip.style.display = 'none'; });
          polygon.addEventListener('click', () => {
            const href = area.getAttribute('href');
            if (!href) return;
            const target = area.getAttribute('target');
            if (target && target !== '_self') window.open(href, target);
            else window.location.href = href;
          });
          overlay.appendChild(polygon);
        });
      }

      if (image.complete) renderAreas();
      else image.addEventListener('load', renderAreas, { once: true });
      window.addEventListener('resize', renderAreas);
    })();
  </script>
