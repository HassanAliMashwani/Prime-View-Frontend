    <style>
      body {
        margin: 0;
        background: #111827;
      }
      .master-plan {
        position: relative;
        width: fit-content;
        max-width: 100%;
      }
      .master-plan img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .master-plan canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .area-details {
        position: fixed;
        z-index: 1;
        display: none;
        padding: 10px 14px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid #67e8f9;
        border-radius: 6px;
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.55);
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>

    <script>
      const image = document.getElementById("master-plan-image");
      const canvas = document.getElementById("area-highlight");
      const context = canvas.getContext("2d");
      const details = document.getElementById("area-details");
      const areas = document.querySelectorAll("area[alt]");

      function readablePascalCase(value) {
        return value
          .replace(/([a-z\d])([A-Z])/g, "$1 $2")
          .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
          .replace(/^./, (character) => character.toUpperCase());
      }

      function resizeHighlight() {
        const scaleX = image.clientWidth / image.naturalWidth;
        const scaleY = image.clientHeight / image.naturalHeight;
        const devicePixelRatio = window.devicePixelRatio || 1;

        canvas.width = image.clientWidth * devicePixelRatio;
        canvas.height = image.clientHeight * devicePixelRatio;
        context.setTransform(
          devicePixelRatio * scaleX,
          0,
          0,
          devicePixelRatio * scaleY,
          0,
          0,
        );
      }

      function showHighlight(area, event) {
        const coordinates = area.coords.split(",").map(Number);
        context.clearRect(0, 0, image.naturalWidth, image.naturalHeight);
        context.beginPath();
        context.moveTo(coordinates[0], coordinates[1]);
        for (let index = 2; index < coordinates.length; index += 2) {
          context.lineTo(coordinates[index], coordinates[index + 1]);
        }
        context.closePath();
        context.fillStyle = "rgba(34, 211, 238, 0.22)";
        context.shadowColor = "rgba(34, 211, 238, 0.95)";
        context.shadowBlur = 24;
        context.fill();
        context.shadowBlur = 0;
        context.strokeStyle = "#67e8f9";
        context.lineWidth = 4;
        context.stroke();

        details.textContent = area.alt
          .split("_")
          .map(readablePascalCase)
          .join(" - ");
        details.style.display = "block";
        details.style.left = `${event.clientX + 16}px`;
        details.style.top = `${event.clientY + 16}px`;
      }

      function hideHighlight() {
        context.clearRect(0, 0, image.naturalWidth, image.naturalHeight);
        details.style.display = "none";
      }

      image.addEventListener("load", resizeHighlight);
      if (image.complete) resizeHighlight();
      window.addEventListener("resize", resizeHighlight);
      areas.forEach((area) => {
        area.title = area.alt.split("_").map(readablePascalCase).join(" - ");
        area.addEventListener("mouseenter", (event) =>
          showHighlight(area, event),
        );
        area.addEventListener("mousemove", (event) => {
          details.style.left = `${event.clientX + 16}px`;
          details.style.top = `${event.clientY + 16}px`;
        });
        area.addEventListener("mouseleave", hideHighlight);
      });
    </script>
